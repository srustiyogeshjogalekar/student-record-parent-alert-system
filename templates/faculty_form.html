<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Faculty</title><link rel="stylesheet" href="{{ url_for('static',filename='css/mint.css') }}"></head><body class="mint-page"><main class="mint-content"><div class="mint-heading"><div><h1>Edit Faculty</h1><p>{{ faculty.faculty_id }}</p></div></div>{% if error %}<div class="mint-message error">{{ error }}</div>{% endif %}<section class="mint-card"><form method="post" style="display:grid;gap:12px;max-width:500px"><label>Faculty Name<input name="name" value="{{ faculty.name }}" required></label><label>Email<input name="email" type="email" value="{{ faculty.email }}" required></label><label>Phone<input name="phone" value="{{ faculty.phone }}" required></label><label>Department<input name="department" value="{{ faculty.department }}" required></label><label>Designation<input name="designation" value="{{ faculty.designation }}" required></label><label>New password (leave blank to keep current)<input name="password" type="password"></label><button class="mint-import-btn">Save Changes</button></form></section></main></body></html>
